<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- MoleculeIQ Precision Favicon -->
  <defs>
    <linearGradient id="fav-grad" x1="10" y1="8" x2="58" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal Scaffold Frame -->
  <path d="M32 8 L53 20 L53 44 L32 56 L11 44 L11 20 Z" stroke="#334155" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- IQ Core Lattice -->
  <!-- I spine -->
  <line x1="32" y1="8" x2="32" y2="56" stroke="url(#fav-grad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Q loop -->
  <path d="M32 32 L53 20 L53 44 L32 56 Z" stroke="url(#fav-grad)" stroke-width="3.5" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.08)"/>
  <!-- Q terminal insight bond -->
  <line x1="46" y1="48" x2="58" y2="57" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Cross link -->
  <line x1="11" y1="20" x2="32" y2="32" stroke="#64748b" stroke-width="2.5"/>

  <!-- Atomic Vertices -->
  <circle cx="32" cy="8" r="3" fill="#ffffff"/>
  <circle cx="53" cy="20" r="2.8" fill="#38bdf8"/>
  <circle cx="53" cy="44" r="2.8" fill="#38bdf8"/>
  <circle cx="32" cy="56" r="3" fill="#ffffff"/>
  <circle cx="58" cy="57" r="2.5" fill="#38bdf8"/>

  <!-- Central Core Node -->
  <circle cx="32" cy="32" r="4.5" fill="#080c14" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="1.8" fill="#38bdf8"/>
</svg>
