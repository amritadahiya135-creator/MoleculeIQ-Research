<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- MoleculeIQ Precision Chemical Mark -->
  <defs>
    <linearGradient id="miq-mark-grad" x1="17" y1="12" x2="94" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="miq-node-glow" x="42" y="42" width="16" height="16" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hexagonal Scaffold & IQ Lattice Bonds -->
  <g stroke="url(#miq-mark-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Scaffold Bonds -->
    <path d="M50 14 L83 33 L83 67 L50 86 L17 67 L17 33 Z" opacity="0.4"/>

    <!-- Central 'I' Vertical Axis (Precision Backbone) -->
    <path d="M50 14 L50 50 L50 86" stroke-width="4.5"/>

    <!-- 'Q' Loop: Central node -> V1 -> V2 -> V3 -> C -->
    <path d="M50 50 L83 33 L83 67 L50 86 L50 50" stroke-width="4.5"/>

    <!-- 'Q' Insight Tail Vector: projecting from lower right vertex -->
    <path d="M72 75 L92 89" stroke="#38bdf8" stroke-width="4.5"/>

    <!-- Left Valence Connecting Bond -->
    <path d="M17 33 L50 50"/>
  </g>

  <!-- Atomic Coordinate Nodes -->
  <!-- Outer vertices -->
  <circle cx="50" cy="14" r="4.5" fill="#f8fafc" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="83" cy="33" r="4" fill="#38bdf8"/>
  <circle cx="83" cy="67" r="4" fill="#38bdf8"/>
  <circle cx="50" cy="86" r="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="17" cy="67" r="3.5" fill="#64748b"/>
  <circle cx="17" cy="33" r="3.5" fill="#64748b"/>

  <!-- 'Q' Exit Node -->
  <circle cx="92" cy="89" r="3.5" fill="#38bdf8"/>

  <!-- Core Intelligence Node (Center) -->
  <circle cx="50" cy="50" r="6" fill="#080c14" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="50" cy="50" r="2.5" fill="#38bdf8"/>
</svg>
