name: MoleculeIQ Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies for RDKit
      run: |
        sudo apt-get update
        sudo apt-get install -y libxrender1 libxext6 libsm6

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify Cryptographic Artifact Integrity (SHA-256)
      run: |
        python -c "from src.utils.integrity import verify_artifact_checksums; res = verify_artifact_checksums(); print(f'Integrity check: {res.verified_count} artifacts verified. Valid: {res.is_valid}'); assert res.is_valid, res.error_message"

    - name: Run Core Chemistry & ML Unit Tests
      run: |
        python -m pytest tests/unit/ -v --tb=short

    - name: Run Integration & E2E Workflows
      run: |
        python -m pytest tests/integration/ tests/e2e/ -v --tb=short

    - name: Run Performance Benchmarks Smoke Test
      run: |
        python -m pytest tests/benchmarks/ -v --tb=short
